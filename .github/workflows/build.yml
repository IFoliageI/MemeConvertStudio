name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.architecture }} application
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
          - architecture: arm64
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build application and plugins
        run: .\build.ps1 -Architecture ${{ matrix.architecture }} -HostArchitecture x64
      - name: Package application and plugins
        run: .\package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MemeConvertStudio-Windows-${{ matrix.architecture }}
          path: |
            MemeStudio-Windows-${{ matrix.architecture }}.zip
            MemeStudio-Plugins-${{ matrix.architecture }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
