name: Build Plugin

on:
  push:
    branches: ['plugin-*']
  pull_request:
    branches: ['plugin-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.architecture }} plugin
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build standalone plugin
        run: .\build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MemeStudio-Qwen-Plugin-Windows-${{ matrix.architecture }}
          path: |
            dist/${{ matrix.architecture }}/
            !dist/**/*.obj
            !dist/**/*.lib
            !dist/**/*.exp
          if-no-files-found: error
          retention-days: 14
